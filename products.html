
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/products.css">

    <title>Produtos | ClaudeSport</title>
</head>
<body>
<header class="cabecalho">
    <a href="index.html" class="marca" aria-label="ClaudeSport - Início">
        <img
            src="assets/images/Emblema de Leão com Coroa Vermelha.png"
            alt=""
            class="marca-logo"
        >
        <span class="marca-claude">CLAUDE</span>
        <span class="marca-store">SPORT</span>
    </a>

    <button
        class="botao-menu"
        id="botao-menu"
        type="button"
        aria-label="Abrir menu"
        aria-controls="menu-principal"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="menu-principal" class="menu-principal" aria-label="Navegação principal">

        <!-- Início -->
        <a href="index.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 10 9-7 9 7"/>
                <path d="M5 9v12h14V9"/>
                <path d="M9 21v-7h6v7"/>
            </svg>
            <span>Início</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Produtos -->
        <a href="products.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 7h15l-1.5 9h-12z"/>
                <path d="M6 7 4.5 3H2"/>
                <circle cx="9" cy="20" r="1"/>
                <circle cx="18" cy="20" r="1"/>
            </svg>
            <span>Produtos</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Sobre -->
        <a href="about.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="6"/>
                <path d="M8.2 12.7 7 22l5-3 5 3-1.2-9.3"/>
            </svg>
            <span>Sobre</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Contato -->
        <a href="contacts.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
            </svg>
            <span>Contato</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Entrar -->
        <a href="login.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="7" r="4"/>
                <path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>
            </svg>
            <span>Entrar</span>
            <span class="seta-menu">↗</span>
        </a>

    </nav>
</header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="catalogo">

        <!-- APRESENTAÇÃO -->
        <section
            class="catalogo-intro"
            aria-labelledby="titulo-catalogo"
        >
            <p class="catalogo-etiqueta">
                EXPLORE NOSSA COLEÇÃO
            </p>

            <h1 id="titulo-catalogo">
                Todos os produtos<span>.</span>
            </h1>

            <p class="catalogo-descricao">
                Encontre os equipamentos certos para superar seus limites.
            </p>
        </section>

        <!-- PESQUISA E FILTROS -->
        <section
            class="catalogo-ferramentas"
            aria-label="Pesquisar e filtrar produtos"
        >
            <label class="campo-pesquisa">
                <span class="visualmente-oculto">
                    Pesquisar produtos
                </span>

                <input
                    type="search"
                    id="pesquisa-produtos"
                    placeholder="Buscar produto..."
                    autocomplete="off"
                >
            </label>

            <div class="campo-categoria" id="seletor-categoria">
    <span class="visualmente-oculto" id="rotulo-categoria">
        Filtrar por categoria
    </span>

    <button
        type="button"
        id="botao-categoria"
        class="botao-categoria"
        aria-labelledby="rotulo-categoria botao-categoria-texto"
        aria-haspopup="listbox"
        aria-expanded="false"
    >
        <span id="botao-categoria-texto">Todas as categorias</span>
        <span class="seta-categoria" aria-hidden="true"></span>
    </button>

    <div
        id="opcoes-categoria"
        class="opcoes-categoria"
        role="listbox"
        aria-labelledby="rotulo-categoria"
        hidden
    ></div>
</div>
        </section>

        <!-- RESULTADOS -->
        <div class="catalogo-resultados" aria-live="polite">
            <p id="contador-produtos">
                Carregando produtos...
            </p>
        </div>

        <!-- GRADE DE PRODUTOS -->
        <section
            id="grade-produtos"
            class="grade-produtos"
            aria-label="Lista de produtos"
        >
            <noscript>
                Ative o JavaScript para visualizar os produtos.
            </noscript>
        </section>

    </main>

    <!-- RODAPÉ -->
    <footer class="rodape-produtos">
        <p>
            &copy; 2026 ClaudeSport. Todos os direitos reservados.
        </p>

        <a href="privacy.html">
            Privacidade e LGPD
        </a>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="assets/js/menu.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/carrinho.js"></script>

</body>
</html>
