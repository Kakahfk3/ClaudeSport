
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="icon" href="assets/images/Emblema de Leão com Coroa Vermelha.png" type="image/png">

    <title>Entrar | ClaudeSport</title>
</head>
<body>

<header class="cabecalho">
    <a href="index.html" class="marca" aria-label="ClaudeSport - Início">
        <img
            src="assets/images/Emblema de Leão com Coroa Vermelha.png"
            alt=""
            class="marca-logo"
        >
        <span class="marca-claude">CLAUDE</span>
        <span class="marca-store">SPORT</span>
    </a>

    <button
        class="botao-menu"
        id="botao-menu"
        type="button"
        aria-label="Abrir menu"
        aria-controls="menu-principal"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="menu-principal" class="menu-principal" aria-label="Navegação principal">

        <!-- Início -->
        <a href="index.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 10 9-7 9 7"/>
                <path d="M5 9v12h14V9"/>
                <path d="M9 21v-7h6v7"/>
            </svg>
            <span>Início</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Produtos -->
        <a href="products.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 7h15l-1.5 9h-12z"/>
                <path d="M6 7 4.5 3H2"/>
                <circle cx="9" cy="20" r="1"/>
                <circle cx="18" cy="20" r="1"/>
            </svg>
            <span>Produtos</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Sobre -->
        <a href="about.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="6"/>
                <path d="M8.2 12.7 7 22l5-3 5 3-1.2-9.3"/>
            </svg>
            <span>Sobre</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Contato -->
        <a href="contacts.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
            </svg>
            <span>Contato</span>
            <span class="seta-menu">↗</span>
        </a>

        <!-- Entrar -->
        <a href="login.html">
            <svg class="icone-menu" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="7" r="4"/>
                <path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>
            </svg>
            <span>Entrar</span>
            <span class="seta-menu">↗</span>
        </a>

    </nav>
</header>
    <main class="pagina-login">
        <section class="login-card">
            <p class="login-etiqueta">BEM-VINDO À CLAUDESPORT</p>
            <h1>Entre na sua conta<span>.</span></h1>
            <p class="login-descricao">
                Acesse sua conta para continuar sua jornada esportiva.
            </p>

            <form id="form-login">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

                <p id="mensagem-login" role="status" aria-live="polite"></p>

                <button type="submit" class="botao-entrar">
                    Entrar na conta
                </button>
            </form>

            <a href="index.html" class="login-voltar">
                Voltar para o início
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ClaudeSport. Todos os direitos reservados.</p>
        <a href="privacy.html">Privacidade e LGPD</a>
    </footer>

    <script src="assets/js/menu.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
